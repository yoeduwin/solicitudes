<!-- El CDN de Tailwind procesa @apply solo dentro de un bloque type="text/tailwindcss". -->
<style type="text/tailwindcss">
  /* ==================================================================
   * Clases de apoyo sobre Tailwind, para no repetir cadenas largas.
   * ================================================================== */

  /* ---------- Indicadores ---------- */
  .kpi {
    @apply relative bg-white border rounded-xl p-3.5 text-left transition-all duration-150
           hover:shadow-md hover:-translate-y-px focus:outline-none focus-visible:ring-2
           focus-visible:ring-emerald-600;
  }
  .kpi-num { @apply block text-2xl font-bold leading-none tabular-nums; }
  .kpi-lbl { @apply block text-xs text-slate-500 mt-1.5 font-medium; }
  .kpi.activo { @apply ring-2 ring-emerald-700 shadow-md; }
  /* Marca del filtro activo. Va en ::before porque ::after lo ocupa el tooltip. */
  .kpi.activo::before {
    content: '';
    @apply absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-emerald-700;
  }

  /* ---------- Formularios ---------- */
  .filtro {
    @apply rounded-lg border border-slate-300 px-2.5 py-2 text-sm bg-white transition
           hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-600
           focus:border-emerald-600;
  }
  .entrada {
    @apply mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm transition
           placeholder:text-slate-400 hover:border-slate-400
           focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600;
  }
  .campo { @apply block text-sm font-medium text-slate-700; }

  /* ---------- Botones ---------- */
  .btn-primario {
    @apply inline-flex items-center justify-center gap-1.5 rounded-lg bg-emerald-800 px-4 py-2
           text-sm font-semibold text-white transition hover:bg-emerald-700 active:scale-[.98]
           focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600
           focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed
           disabled:active:scale-100;
  }
  .btn-secundario {
    @apply inline-flex items-center justify-center gap-1.5 rounded-lg border border-slate-300
           bg-white px-4 py-2 text-sm transition hover:bg-slate-50 hover:border-slate-400
           active:scale-[.98] focus:outline-none focus-visible:ring-2
           focus-visible:ring-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed;
  }
  .btn-cabecera {
    @apply inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm bg-emerald-800/70
           border border-emerald-700 transition hover:bg-emerald-700
           focus:outline-none focus-visible:ring-2 focus-visible:ring-white/60;
  }

  .tab-vista, .tab-alcance {
    @apply px-3 py-1.5 text-sm bg-white transition hover:bg-slate-50 focus:outline-none
           focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-emerald-600;
  }
  .tab-vista.activo, .tab-alcance.activo {
    @apply bg-emerald-800 text-white hover:bg-emerald-800 font-medium;
  }

  /* ---------- Modales ---------- */
  .modal { @apply fixed inset-0 z-40 bg-slate-900/60 overflow-y-auto p-3 sm:p-6; }
  .modal-caja {
    @apply bg-white rounded-xl shadow-2xl mx-auto w-full;
    animation: aparecer .16s ease-out;
  }
  .modal-head {
    @apply flex items-start justify-between gap-3 px-5 py-3.5 border-b border-slate-200
           sticky top-0 bg-white/95 backdrop-blur rounded-t-xl z-10;
  }
  .modal-body { @apply p-5; }

  @keyframes aparecer {
    from { opacity: 0; transform: translateY(8px) scale(.99); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Tarjetas del Kanban ---------- */
  .tarjeta {
    @apply bg-white border border-slate-200 rounded-lg p-3 text-left w-full transition-all
           duration-150 hover:border-emerald-600 hover:shadow-md cursor-pointer
           focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600;
  }
  .tarjeta.vencida { @apply border-red-300 bg-red-50/70; }
  .tarjeta.arrastrando { @apply opacity-40 rotate-1; }
  /* Mientras el backend confirma el movimiento, la tarjeta se ve "en espera". */
  .tarjeta.guardando { @apply opacity-60 pointer-events-none; }

  .columna { @apply bg-slate-50/80 border border-slate-200 rounded-xl p-2 transition-colors; }
  .columna.recibiendo { @apply bg-emerald-50 ring-2 ring-emerald-400 border-emerald-300; }
  .zona-drop { min-height: 90px; }

  .etq {
    @apply inline-block rounded px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide
           align-middle;
  }

  /* ---------- Esqueletos de carga ----------
   * Se muestra la silueta del contenido en vez de un texto "Cargando…":
   * la espera del arranque de Apps Script se percibe más corta.        */
  .esqueleto {
    @apply bg-slate-200 rounded;
    animation: latir 1.4s ease-in-out infinite;
  }
  @keyframes latir { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

  /* ---------- Tooltips ----------
   * Uso: <button data-tip="Explicación breve">…</button>
   * Aparecen al pasar el cursor y también al llegar con el teclado (Tab).
   * data-tip-abajo los coloca debajo, para elementos pegados al borde superior. */
  [data-tip] { @apply relative; }
  [data-tip]::after {
    content: attr(data-tip);
    @apply pointer-events-none absolute left-1/2 bottom-full z-50 mb-2 w-max max-w-[15rem]
           -translate-x-1/2 rounded-md bg-slate-900 px-2.5 py-1.5 text-xs font-normal
           normal-case tracking-normal text-white opacity-0 shadow-lg transition-opacity
           duration-150;
    white-space: normal;
    text-align: left;
    line-height: 1.35;
  }
  [data-tip]:hover::after,
  [data-tip]:focus-visible::after { @apply opacity-100; }
  [data-tip-abajo]::after { @apply bottom-auto top-full mb-0 mt-2; }
  /* En pantallas táctiles el hover no existe y el tooltip estorbaría. */
  @media (hover: none) {
    [data-tip]::after { content: none; }
  }

  /* ---------- Ayuda ---------- */
  .ayuda-si { @apply border-l-4 border-emerald-600 bg-emerald-50/60 rounded-r-lg p-4; }
  .ayuda-no { @apply border-l-4 border-slate-400 bg-slate-50 rounded-r-lg p-4; }
  .ayuda-lista { @apply mt-2 space-y-1.5 text-sm text-slate-700 list-none pl-4; }
  /* Ojo: el <li> NO debe ser flex. Con texto mixto (nodos de texto + <strong>),
   * flex convierte cada fragmento en una caja independiente que se ajusta de
   * línea por su cuenta, y el texto se ve roto en pedazos sueltos. */
  .ayuda-lista li { @apply relative; }
  .ayuda-lista li::before {
    content: '·';
    @apply absolute -left-4 text-slate-400 font-bold;
  }
</style>
